# Production-style stack: PostgreSQL + the app (DOC-002, docs/DEPLOYMENT.md).
# Secrets come from a .env.production file next to this one (never committed):
#   POSTGRES_PASSWORD=...           strong random password
#   BETTER_AUTH_SECRET=...          openssl rand -base64 32
#   BETTER_AUTH_URL=https://order.example.com   public URL printed in table QR codes
# Start:  docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ordering
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ordering
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ordering"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://ordering:${POSTGRES_PASSWORD}@db:5432/ordering
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?set BETTER_AUTH_URL}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - uploads:/app/storage/uploads

volumes:
  db-data:
  uploads:
